schema_version: 1

context:
  name: aia-chaser
  version: "3.6.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aia_chaser-${{ version }}.tar.gz
  sha256: ce39680bfc58cd6055aaeb22310c0eeb83979aabef6312c2771dc41fea19564c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - cryptography >=44.0.1
    - tenacity >=8
    - cachetools >=5.2.0

tests:
  - python:
      imports:
        - aia_chaser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Chase authority information access from a host certificate to complete the chain of trust.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jponf/aia-chaser
  repository: https://github.com/jponf/aia-chaser
  documentation: https://aia-chaser.readthedocs.io

extra:
  recipe-maintainers:
    - HeavyTony2
