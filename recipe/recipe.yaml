schema_version: 1

context:
  name: aia-chaser
  version: "3.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aia_chaser-${{ version }}.tar.gz
  sha256: f0e50e61a5e3d21917d273b5af8a4375a48227e36fb6bdd952359933f40e9642

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - cryptography >=44.0.1
    - tenacity >=8

tests:
  - python:
      imports:
        - aia_chaser
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  summary: Chase authority information access from a host certificate to complete the chain of trust.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jponf/aia-chaser
  repository: https://github.com/jponf/aia-chaser
  documentation: https://aia-chaser.readthedocs.io

extra:
  recipe-maintainers:
    - HeavyTony2
